.two:not(.sbf){grid-template-columns:1fr;gap:26px}.tools span{transition:background .2s,color .2s,border-color .2s;cursor:default}.tools span:hover{background:#000;color:#fff;border-color:#000}.split .fig figcaption{text-align:center}.sec.tint{color:#000}

const P=[
{s:'devil-wears-prada-essie',t:'The Devil Wears Prada x essie',k:'Campaign',th:'h1',c:'#dc1410',d:true,hb:1,sub:'self-initiated campaign concept',
 desc:'essie is teaming up with The Devil Wears Prada 2 to launch a limited-edition nail polish line honoring the various shades of red worn by women everywhere. The collection features a total of four shades, from the deepest red \u2018Power Suit\u2019 to the lightest \u2018Girl Boss\u2019. This collection is made to encourage every woman to wear red, fearlessly.',
 b:[{h:'Campaign objectives',n:['Drive brand awareness and PR through high-profile partnerships','Increase essie product sales by 20% within the first month of the film\u2019s release','Boost social media engagement by 15% within the first month of the film\u2019s release']},
 {h:'Campaign executions',band:1,f:[['es_v','Commercial','v']],g:[['es_ch','Challenge','p'],['es_s','Social media'],['es_m','Magazine']]},
 {h:'Timeline & Metrics',tl:[['Tease','Build anticipation'],['Launch','Reveal the collaboration'],['Engage','Activate the challenge'],['Convert','Drive product sales']],m:[['+20%','Product Sales','Target increase in sales campaign with campaign visibility'],['+15%','Social Engagement','Target increase in engagement campaign visibility'],['\u2191','Brand Awareness','Increase reach and campaign and campaign visibility']],note:'Projected campaign targets, not actual results.'},
 {h:'Why it works',band:1,n:['Both essie and The Devil Wears Prada 2 speak to the same woman. Ambitious, fashion-forward, and ready to own her moment. The collaboration meets her exactly where she is.','Red has always carried weight for women \u2014 too bold, too loud, too much. This campaign reclaims that narrative at a moment when female empowerment in the workplace is louder than ever.','Four shades, one collection, tied to a major film release. The scarcity drives demand and gives consumers a reason to act now before it\u2019s gone.']}]},
{s:'american-eagle-sydney-sweeney',t:'American Eagle x Sydney Sweeney',k:'Campaign',th:'h2',c:'#9bb0d3',sub:'self-initiated campaign concept',
 desc:'This project reimagines American Eagle\u2019s Sydney Sweeney denim campaign through a strategic and creative lens, addressing the controversy surrounding its original messaging. By refining the campaign slogan, developing a cohesive visual identity, and creating an interactive social media activation, the concept aims to foster inclusivity while maintaining the brand\u2019s aspirational appeal.',
 b:[{h:'The controversy',pw:1,f:[['ae1','']],p:'The tagline\u2019s broad interpretation sparked unintended associations with eugenics and raised questions about representation. By referencing a narrow beauty ideal, the campaign risked unintentionally alienating an entire buying group. After all, who wants to buy a product that isn\u2019t marketed towards them?'},
 {h:'Adjustments',band:1,n:['Shift the tagline away from Sydney herself and toward Sydney wearing American Eagle jeans, keeping the product at the center of the campaign.','Refine the campaign\u2019s visual direction to support a more inclusive message while retaining American Eagle\u2019s recognizable aesthetic.','Introduce an interactive concept that invites consumers to participate and express their individuality, rather than simply observe the campaign.']},
 {h:'Campaign executions',f:[['ae2','Billboard'],['ae_v','Promotional video','v'],['ae4','Poster','f']]},
 {h:'Why it works',band:1,n:['Celebrity aspiration: Sydney Sweeney commands a loyal, emotionally invested audience. By positioning her as the face of the campaign, American Eagle leverages that affinity to drive consumer desire and brand loyalty.','Clarity of messaging: the revised slogan eliminates the ambiguity and harmful cultural associations of the original campaign. \u201cMy jeans are American Eagle. What are yours?\u201d is direct, confident, and universally accessible \u2014 inviting the consumer in rather than alienating them.','Value pricing: consumers are not simply purchasing denim, they are purchasing the lifestyle and identity associated with Sydney Sweeney. This emotional investment justifies the price point and elevates the perceived value of the product.']}]},

{s:'ray-ban',t:'Ray-ban',k:'Email Marketing',th:'h4',c:'#c92d30',d:true,hb:1,tools:['Figma','Figma AI','Milled','Canva','Apple Inspect','Chrome CSS Peeper'],sub:'a self-initiated email marketing campaign',
 desc:'This email campaign highlights Ray-Ban\u2019s collaboration with Jennie, combining bold campaign imagery, product-focused messaging, and a sleek visual hierarchy to showcase the collection. The design emphasizes the sunglasses\u2019 features and limited-edition appeal while maintaining Ray-Ban\u2019s recognizable brand identity and encouraging customers to shop.',
 b:[{h:'Design strategy',p:'I sourced visual assets directly from Ray-Ban\u2019s website to maintain consistency with the brand\u2019s existing identity across typography, color palette, and imagery.'},
 {h:'Execution',sp:{l:[['rb_v','Mobile scroll','p']],ch:'Cohesion',l2:[['rb2','The new campaign alongside previous ones']],r:[['rb1','Full email']]}}]},

 desc:'bare is a holistic skincare brand that brings together nature and science to restore the skin\u2019s natural balance. Centered on ceramides and skin barrier repair, bare embraces simplicity, believing in doing less, but doing it better.',

function proj(p){
 const i=P.indexOf(p),nx=P[(i+1)%P.length];
 let h=`<header class="hero ${p.d&&!p.hb?'dark':''}" style="background:${p.c}"><h1>${esc(p.t)}</h1>${p.sub?`<em>${p.sub}</em>`:''}<p>${p.desc}</p>${p.tools?`<div class="tools"><b>Tools</b>${p.tools.map(x=>'<span>'+x+'</span>').join('')}</div>`:''}</header>`;
 let pv='t';for(const b of p.b){
  const ty=b.band?'c':'w';pv=ty;const bg=ty==='c'?`style="background:${p.c}"`:ty==='t'?`style="background:${p.tn||'color-mix(in srgb,'+p.c+' 16%,#fff)'}"`:'',cl=ty==='c'?'sec band':ty==='t'?'sec tint':'sec';

function scr(){const h=document.getElementById('scr');if(!h)return;const txt=h.textContent,L='abcdefghijklmnopqrstuvwxyz',U=L.toUpperCase(),P={},rc=c=>{const a=P[c];return a?a[Math.random()*a.length|0]:c};const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;const words=txt.split(' ');h.setAttribute('aria-label',txt);h.innerHTML=words.map(w=>'<span class="sw2" aria-hidden="true">'+w+'</span>').join(' ');const sp=[...h.children];let started=false;const sc=()=>sp.forEach((s,i)=>s.textContent=[...words[i]].map(rc).join(''));const run=()=>{if(started)return;started=true;if(rm){sp.forEach((s,i)=>s.textContent=words[i]);return}const t0=performance.now(),tot=sp.length*40+300;let last=0;const tick=now=>{const p=now-t0;if(p>=tot){sp.forEach((s,i)=>s.textContent=words[i]);return}if(now-last>45){last=now;sp.forEach((s,i)=>s.textContent=[...words[i]].map((c,j)=>p>=i*40+j*14?c:rc(c)).join(''))}requestAnimationFrame(tick)};requestAnimationFrame(tick)};h.style.visibility='hidden';Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]).then(()=>{if(!h.isConnected)return;const cx=document.createElement('canvas').getContext('2d');cx.font=getComputedStyle(h).font;const W={};(L+U).split('').forEach(l=>W[l]=cx.measureText(l).width);(L+U).split('').forEach(l=>{const s=L.includes(l)?L:U;P[l]=s.split('').filter(x=>Math.abs(W[x]-W[l])<=Math.max(.09*W[l],1))});sp.forEach(s=>s.style.width=s.offsetWidth+'px');sc();h.style.visibility='';if(matchMedia('(hover:none)').matches)setTimeout(run,900)});['mouseenter','focus','touchstart'].forEach(e=>h.addEventListener(e,run,{passive:true}))}
